name: Tests

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

# One job, named "test" (the check the pull request waits for), on PostgreSQL: local development and
# production use PostgreSQL. Actions are pinned to full commit SHAs.
#
# PostgreSQL is started by a step, not a service container, because a service container cannot take server
# flags and max_locks_per_transaction is only read when the server starts.
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      APP_KEY: base64:59rcOaGkAzZTfiPLXyL80YfTCZe71t2LwAFPoiqx6pM=
      ARKESEL_SENDER: NkwaLedger
      REPORT_SECRET: base64:jV5e2oTqMJjzcYflr1E/sy9MgYt/DdhcbexDEX551P4=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: nkwaledger_test
      DB_USERNAME: ci_user
      DB_PASSWORD: ci_throwaway_password

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # a throwaway database that exists only for this job; the credentials below are made up for it and open
      # nothing else. The suite itself refuses any database not named *_test or not on 127.0.0.1.
      # 256 locks per transaction (the default is 64): many parallel workers each drop every table at the start.
      # Readiness is checked over TCP, because during first-time setup the image answers only on its socket.
      - name: Start PostgreSQL 17
        run: |
          docker run -d --name postgres -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=ci_user \
            -e POSTGRES_PASSWORD=ci_throwaway_password \
            -e POSTGRES_DB=nkwaledger_test \
            postgres:17 -c max_locks_per_transaction=256
          for i in $(seq 1 24); do
            if docker exec postgres pg_isready -h 127.0.0.1 -U ci_user -d nkwaledger_test; then
              exit 0
            fi
            sleep 5
          done
          docker logs postgres
          exit 1

      - name: Show the live PostgreSQL lock setting
        run: docker exec postgres psql -U ci_user -d nkwaledger_test -c "show max_locks_per_transaction"

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          extensions: pdo, pdo_sqlite, pdo_pgsql, redis
          coverage: none
          ini-values: memory_limit=512M

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install NPM dependencies
        run: npm ci --legacy-peer-deps

      # the pages have to exist on disk before Inertia's test page finder can see them
      - name: Build assets
        run: npm run build

      # parallel workers each get their own *_test_N database
      - name: Run tests on PostgreSQL
        run: php artisan test --parallel --exclude-group=sequential-pg

      # the concurrency test starts real processes against one shared database, so it runs alone
      - name: Run the concurrency test on PostgreSQL
        run: php artisan test --group=sequential-pg
